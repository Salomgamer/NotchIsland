name: DynamicNotch
options:
  bundleIdPrefix: com.dynamicnotch
  deploymentTarget:
    iOS: 15.0
targets:
  DynamicNotch:
    type: application
    platform: iOS
    deploymentTarget: 15.0
    sources:
      - path: NotchIsland
    info:
      path: NotchIsland/Info.plist
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.dynamicnotch.app
      PRODUCT_NAME: DynamicNotch
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      CURRENT_PROJECT_VERSION: "5.2"
      MARKETING_VERSION: "5.2"
      CODE_SIGN_IDENTITY: ""
      CODE_SIGNING_REQUIRED: NO
      CODE_SIGNING_ALLOWED: NO
