skipInterval: CMTime, completion completionHandler: @escaping () -> Void) {
                  DispatchQueue.main.async { [weak self] in
                      if skipInterval.seconds > 0 {
                          self?.viewModel?.nextTrack()
                      } else {
                          self?.viewModel?.previousTrack()
                      }
                      self?.pushCurrentFrame()
                      completionHandler()
                  }
              }
          }

          /// Hosts the visible SampleBufferDisplayView on screen so iOS automatically transitions it into a
          /// floating Picture-in-Picture Dynamic Island pill the moment the user swipes Home.
          struct PiPLayerHostView: UIViewRepresentable {
              let sampleView: SampleBufferDisplayView

              func makeUIView(context: Context) -> UIView {
                  let container = UIView(frame: CGRect(x: 0, y: 0, width: 320, height: 72))
                  container.backgroundColor = .clear
                  sampleView.frame = container.bounds
                  sampleView.autoresizingMask = [.flexibleWidth, .flexibleHeight]
                  sampleView.layer.cornerRadius = 26
                  sampleView.layer.masksToBounds = true
                  container.addSubview(sampleView)
                  return container
              }

              func updateUIView(_ uiView: UIView, context: Context) {
                  sampleView.frame = uiView.bounds
              }
          }
