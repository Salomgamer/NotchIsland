name: Build NotchIsland IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build iOS IPA & Upload
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build App (Unsigned for Sideloading)
        run: |
          xcodebuild clean build \
            -project NotchIsland.xcodeproj \
            -scheme NotchIsland \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package into IPA
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/NotchIsland.app Payload/
          zip -r NotchIsland.ipa Payload

      - name: Upload IPA to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NotchIsland-IPA
          path: NotchIsland.ipa
          retention-days: 14

      - name: Upload IPA to Google Drive
        env:
          GDRIVE_CREDENTIALS: ${{ secrets.GDRIVE_CREDENTIALS }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          if [ -z "$GDRIVE_CREDENTIALS" ] || [ -z "$GDRIVE_FOLDER_ID" ]; then
            echo "::notice::Google Drive secrets (GDRIVE_CREDENTIALS or GDRIVE_FOLDER_ID) not configured. Skipping Google Drive upload. IPA is available in GitHub Artifacts."
            exit 0
          fi
          pip3 install --quiet google-api-python-client google-auth
          python3 .github/scripts/upload_gdrive.py
