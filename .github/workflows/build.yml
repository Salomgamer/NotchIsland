name: Build DynamicNotch IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build iOS IPA & Upload
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build App (Unsigned for Sideloading)
        run: |
          xcodebuild clean build \
            -project DynamicNotch.xcodeproj \
            -scheme DynamicNotch \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package into IPA
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/DynamicNotch.app Payload/
          zip -r DynamicNotch.ipa Payload

      - name: Upload IPA to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DynamicNotch-IPA
          path: DynamicNotch.ipa
          retention-days: 14

      - name: Update GitHub Release Asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload v3.6 DynamicNotch.ipa --clobber || gh release upload v3.5 DynamicNotch.ipa --clobber || gh release upload v3.4 DynamicNotch.ipa --clobber || gh release upload v3.3 DynamicNotch.ipa --clobber || gh release upload v3.2 DynamicNotch.ipa --clobber || gh release upload v3.1 DynamicNotch.ipa --clobber || gh release upload v2.0 DynamicNotch.ipa --clobber || echo "Release upload skipped"
